<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero de tareas</title>
  <!-- Sin favicon propio: este href vacio evita que el navegador pida
       /favicon.ico y ensucie el registro del servidor con un 404. -->
  <link rel="icon" href="data:,">

  <!-- El CSS, en cinco modulos. Se enlazan por separado y no con @import
       porque asi el navegador los pide en paralelo, y porque el orden en que
       se cargan se LEE en el HTML en lugar de estar escondido en un archivo.

       El orden de prioridad NO lo decide este orden: lo decide la declaracion
       de @layer que esta al principio de tokens.css. Por eso los modulos se
       pueden reordenar aca sin cambiar el resultado. -->
  <!-- Rutas RELATIVAS y no absolutas (/estilos/...). Los archivos viven al lado
       de este HTML, asi que se piden desde donde esta el HTML. Con ruta
       absoluta, servir la carpeta desde otra raiz -por ejemplo Live Server, que
       sirve desde la raiz del proyecto y no desde publico/- hace que el
       navegador los busque en el lugar equivocado y no cargue nada.
       La API, en cambio, sigue con ruta absoluta: no es un archivo al lado del
       HTML, es un servicio que da el servidor. -->
  <link rel="stylesheet" href="estilos/tokens.css">
  <link rel="stylesheet" href="estilos/base.css">
  <link rel="stylesheet" href="estilos/layout.css">
  <link rel="stylesheet" href="estilos/componentes.css">
  <link rel="stylesheet" href="estilos/utilidades.css">
</head>
<body>
  <div class="app">
    <header class="cabecera">
      <div class="marca">
        <h1>Tablero</h1>
        <p id="resumen" class="resumen">Cargando…</p>
      </div>
      <button id="refrescar" type="button" class="boton-sutil">Volver a leer del servidor</button>
    </header>

    <!-- El formulario de captura: lo mas rapido posible. Enter y listo.
         Los demas campos se completan despues, editando la tarjeta. -->
    <form id="formulario-nueva" class="captura" autocomplete="off">
      <input id="titulo-nueva" name="titulo" type="text" placeholder="¿Qué hay que hacer?" required>
      <input id="vence-nueva" name="venceEl" type="date" title="Fecha límite (opcional)">
      <button type="submit" class="boton-principal">Agregar</button>
    </form>

    <!-- El foco (C12). Tiene dos estados y nunca los dos a la vez: o se puede
         arrancar uno, o hay uno andando. El reloj NO lleva la cuenta por su
         lado: muestra la diferencia entre el fin previsto que manda el servidor
         y la hora. Por eso sobrevive a recargar la pagina. -->
    <section class="foco" aria-label="Pomodoro">
      <div id="foco-libre" class="foco-libre">
        <span class="foco-titulo">Foco</span>
        <button type="button" class="boton-principal" data-duracion="25">25 min</button>
        <button type="button" data-duracion="50">50 min</button>
      </div>

      <div id="foco-corriendo" class="foco-corriendo" hidden>
        <span id="reloj" class="reloj">25:00</span>
        <span class="foco-titulo">en</span>
        <span id="foco-tarea" class="foco-tarea">sin tarea</span>
        <button type="button" id="terminar-pomodoro">Terminar</button>
      </div>
    </section>

    <p id="aviso" class="aviso" hidden></p>

    <main id="tablero" class="tablero" aria-label="Tablero de tareas"></main>

    <footer class="pie">
      <span>Los datos son la fuente de verdad. Arrastrá una tarjeta, o usá las flechas.</span>
    </footer>
  </div>

  <!-- dialog nativo: se abre con showModal(), se cierra con close(), y el
       navegador se encarga del fondo, del foco y de la tecla Escape. -->
  <dialog id="dialogo-editar" class="dialogo">
    <form id="formulario-editar">
      <h2>Editar tarea <span id="editar-id" class="identificador"></span></h2>

      <label>Título
        <input name="titulo" type="text" required>
      </label>

      <label>Detalle
        <textarea name="detalle" rows="3"></textarea>
      </label>

      <div class="en-linea">
        <label>Vence
          <input name="venceEl" type="date">
        </label>
        <label>Estimación (min)
          <input name="estimacionMin" type="number" min="1" step="1">
        </label>
      </div>

      <div class="en-linea">
        <label>Balde
          <select name="balde">
            <option value="">Sin balde</option>
            <option value="A">A · horario ajeno</option>
            <option value="B">B · bloque de foco</option>
            <option value="C">C · otro agente</option>
          </select>
        </label>
        <label>Dimensión
          <select name="dimension">
            <option value="">Sin dimensión</option>
            <option value="rendimiento">rendimiento</option>
            <option value="docente">docente</option>
            <option value="desarrollo">desarrollo</option>
            <option value="salud">salud</option>
            <option value="it-remoto">it-remoto</option>
            <option value="finanzas">finanzas</option>
            <option value="gabinete">gabinete</option>
          </select>
        </label>
      </div>

      <label>Etiquetas <span class="ayuda">(separadas por coma)</span>
        <input name="etiquetas" type="text" placeholder="proyecto, casa">
      </label>

      <label class="casilla">
        <input name="impostergable" type="checkbox">
        Impostergable
      </label>

      <div class="acciones-dialogo">
        <button type="button" id="cancelar-edicion" class="boton-sutil">Cancelar</button>
        <button type="submit" class="boton-principal">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- type="module" permite usar await en el nivel de arriba del script, sin
       envolver todo en una funcion. Es el mismo tipo de modulo que usa Node. -->
  <script type="module" src="app.js"></script>
</body>
</html>
